<div class="row mb-4">
    <div class="col-12">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
                <h6 class="mb-0"><i class="bi bi-bar-chart-line text-primary"></i> Experiment Volume (Last 30 Days)</h6>
            </div>
            <div class="card-body">
                <canvas id="volumeChart" height="80"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-transparent border-0">
                <h6 class="mb-0"><i class="bi bi-check-circle text-success"></i> Success Rate Trend</h6>
            </div>
            <div class="card-body">
                <canvas id="successRateChart" height="160"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-transparent border-0">
                <h6 class="mb-0"><i class="bi bi-graph-up text-info"></i> Average Scores Over Time</h6>
            </div>
            <div class="card-body">
                <canvas id="scoreTrendChart" height="160"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var ctxDefaults = { color: '#94A3B8', borderColor: 'rgba(148, 163, 184, 0.1)' };
    Chart.defaults.color = ctxDefaults.color;
    Chart.defaults.borderColor = ctxDefaults.borderColor;

    var volumeLabels = {{ volume_labels|safe }};
    var volumeValues = {{ volume_values|safe }};
    var successLabels = {{ success_labels|safe }};
    var successRates = {{ success_rates|safe }};
    var scoreLabels = {{ score_labels|safe }};
    var avgPrivacy = {{ avg_privacy_scores|safe }};
    var avgAccuracy = {{ avg_accuracy_scores|safe }};
    var avgThroughput = {{ avg_throughput_scores|safe }};

    if (volumeLabels.length) {
        new Chart(document.getElementById('volumeChart'), {
            type: 'bar',
            data: {
                labels: volumeLabels,
                datasets: [{
                    label: 'Experiments',
                    data: volumeValues,
                    backgroundColor: 'rgba(139, 92, 246, 0.6)',
                    borderColor: 'rgba(139, 92, 246, 1)',
                    borderWidth: 1,
                    borderRadius: 4,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: 'rgba(148, 163, 184, 0.08)' }, ticks: { maxRotation: 45, font: { size: 10 } } },
                    y: { beginAtZero: true, grid: { color: 'rgba(148, 163, 184, 0.08)' }, ticks: { stepSize: 1 } }
                }
            }
        });
    }

    if (successLabels.length) {
        new Chart(document.getElementById('successRateChart'), {
            type: 'line',
            data: {
                labels: successLabels,
                datasets: [{
                    label: 'Success Rate (%)',
                    data: successRates,
                    borderColor: 'rgba(16, 185, 129, 1)',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: 'rgba(16, 185, 129, 1)',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 4,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: 'rgba(148, 163, 184, 0.08)' }, ticks: { font: { size: 10 } } },
                    y: { beginAtZero: true, max: 100, grid: { color: 'rgba(148, 163, 184, 0.08)' } }
                }
            }
        });
    }

    if (scoreLabels.length) {
        new Chart(document.getElementById('scoreTrendChart'), {
            type: 'line',
            data: {
                labels: scoreLabels,
                datasets: [
                    { label: 'Avg Privacy', data: avgPrivacy, borderColor: 'rgba(139, 92, 246, 1)', backgroundColor: 'rgba(139, 92, 246, 0.05)', fill: false, tension: 0.3, pointRadius: 3, borderWidth: 2 },
                    { label: 'Avg Accuracy (%)', data: avgAccuracy, borderColor: 'rgba(236, 72, 153, 1)', backgroundColor: 'rgba(236, 72, 153, 0.05)', fill: false, tension: 0.3, pointRadius: 3, borderWidth: 2 },
                    { label: 'Avg Throughput', data: avgThroughput, borderColor: 'rgba(20, 184, 166, 1)', backgroundColor: 'rgba(20, 184, 166, 0.05)', fill: false, tension: 0.3, pointRadius: 3, borderWidth: 2 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { boxWidth: 12, font: { size: 10 }, padding: 8 } } },
                scales: {
                    x: { grid: { color: 'rgba(148, 163, 184, 0.08)' }, ticks: { font: { size: 10 } } },
                    y: { beginAtZero: true, grid: { color: 'rgba(148, 163, 184, 0.08)' } }
                }
            }
        });
    }
});
</script>
